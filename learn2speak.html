body{background:radial-gradient(900px 500px at 10% -10%,#14b8a655,transparent),radial-gradient(700px 500px at 100% 10%,#f59e0b44,transparent),var(--bg);min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;animation:fl 9s ease-in-out infinite}

.card{box-shadow:0 2px 0 #fff3 inset,0 6px 0 var(--line),0 24px 40px #0003}

async function gem(contents,sys,json){
 if(!S.key)throw Error('Add your free Gemini API key in Settings.');
 const body={contents,generationConfig:{maxOutputTokens:json?2500:700,temperature:.8,thinkingConfig:{thinkingLevel:'low'}}};
 if(sys)body.systemInstruction={parts:[{text:sys}]};
 if(json)body.generationConfig.responseMimeType='application/json';
 const go=()=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify(body)});
 let r=await go(),d=await r.json();
 if(!r.ok&&/think/i.test(d.error?.message||'')){delete body.generationConfig.thinkingConfig;r=await go();d=await r.json()}
 if(!r.ok)throw Error(d.error?.message||'API error');
 const t=d.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';
 return json?JSON.parse(t):t}

const eyes=(g)=>`<path d="M37 40.5Q41.5 37.5 46 40M54 40Q58.5 37.5 63 40" stroke="#3a2220" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="42" cy="46" rx="2.2" ry="2.9" fill="#2b1816"/><ellipse cx="58" cy="46" rx="2.2" ry="2.9" fill="#2b1816"/><circle cx="42.8" cy="44.9" r=".9" fill="#fff"/><circle cx="58.8" cy="44.9" r=".9" fill="#fff"/>`;

const AVD={interviewer:['#f7c6a8','#4a2b27','short','#14213f','suit','glasses','#a5c8ff'],coach:['#c68a62','#2a1a17','short','#f59e0b','','headset','#e6e3a6'],debater:['#f7c6a8','#4a2b27','long','#6ea35f','','glasses','#e6e3a6'],crush:['#f7c6a8','#4a2b27','long','#2f7de8','','heart','#b8ead9'],waiter:['#e2a77f','#2a1a17','short','#f8fafc','vest','','#fcd9b0'],agent:['#e2a77f','#3b2220','bun','#0ea5e9','scarf','','#bae6fd'],doctor:['#f7c6a8','#8b929c','short','#f8fafc','coat','glasses','#b8ead9'],friend:['#f7c6a8','#2f1b19','quiff','#c2410c','','star','#d8d0f5']};
function av(k,cls=''){
 if(k==='tutor')return `<div class="av ${cls}" style="--bgc:${S.tutor.bg}">${tutorSvg(S.tutor)}</div>`;
 const [sk,h,hs,c,o,t,bg]=AVD[k]||AVD.friend;
 return `<div class="av ${cls}" style="--bgc:${bg}"><svg viewBox="0 0 100 100">${(HB[hs]||(()=>''))(h)}<path d="M10 100Q12 69 50 67Q88 69 90 100Z" fill="${c}"/><path d="M41 68Q50 79 59 68Z" fill="${sk}"/>${OUT[o]||''}<rect x="43" y="58" width="14" height="12" rx="5" fill="${sk}"/><ellipse cx="32" cy="48" rx="3.4" ry="5" fill="${sk}"/><ellipse cx="68" cy="48" rx="3.4" ry="5" fill="${sk}"/><ellipse cx="50" cy="46" rx="18" ry="20" fill="${sk}"/>${HF[hs](h)}${eyes()}${mouth}${t?TOP[t]:''}</svg></div>`}
const TD={name:'Podi',gender:'boy',sk:'#f7c6a8',h:'#4a2b27',hs:'quiff',c:'#0f9d6a',o:'hood',ph:'#2563eb',gl:false,bg:'#fde68a'};
S.tutor=Object.assign({},TD,S.tutor);
const ME0={name:'',native:'English',goal:'',field:'',interests:''};
S.me=Object.assign({},ME0,S.me);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function meCtx(){const m=S.me;return [m.name&&`The learner's name is ${m.name}; use it naturally now and then.`,m.goal&&`Their goal: ${m.goal}.`,m.field&&`They do/study: ${m.field}.`,m.interests&&`Interests: ${m.interests}.`,`Their native language is ${m.native}; use it for short explanations.`].filter(Boolean).join(' ')}
function meEditor(v){
 const M=S.me,G=['','Get a job / ace interviews','Travel','Study abroad','Pass an exam (IELTS, TOEFL...)','Grow in my career','Talk with friends and family','Just for fun'];
 const c=el(`<div class="card"><h3 style="margin-top:0">About you</h3><p class="muted">Your tutor uses this to call you by name and personalise lessons. It is saved only in this browser and sent to Gemini along with your messages.</p>
 <label>Your name</label><input id="mn" maxlength="30">
 <label>Your native language</label><select id="mv">${Object.keys(LANGS).map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Main goal</label><select id="mg">${G.map(x=>`<option value="${x}">${x||'Choose a goal'}</option>`).join('')}</select>
 <label>What do you do? (student, developer, nurse...)</label><input id="mf" maxlength="40">

 v.appendChild(c);
 [['mn','name'],['mv','native'],['mg','goal'],['mf','field'],['mi','interests']].forEach(([id,k])=>{const e=c.querySelector('#'+id);e.value=M[k];e.oninput=e.onchange=()=>{M[k]=e.value.trim();tutorC=null;save()}})}
const VC={interviewer:['m',.75,.95,0],coach:['m',.95,1.08,1],debater:['f',1,1.05,0],crush:['f',1.25,.95,1],waiter:['m',1.1,1.1,2],agent:['f',.95,1,2],doctor:['m',.7,.9,3],friend:['m',1.2,1.05,4]};
const FEM=/female|woman|zira|samantha|susan|hazel|heera|kalpana|veena|karen|moira|tessa|fiona|victoria|allison|jenny|aria|sonia|libby|natasha|neerja|swara|lekha|monica|paulina|helena|elsa|katja|hedda|alice|lucia|joana|nanami|yuna|amelie/i;

function pickVoice(k){
 const g=k==='tutor'?(S.tutor.gender==='girl'?'f':'m'):VC[k][0],i=k==='tutor'?0:VC[k][3],pre=LANGS[S.lang].slice(0,2).toLowerCase();

 let pool=all.filter(v=>gd(v)===g);if(!pool.length)pool=all.filter(v=>!gd(v));if(!pool.length)pool=all;
 return pool.length?pool[i%pool.length]:null}
let stp=0;
function learnCard(v){const c=el(`<div class="card"><h3 style="margin-top:0">What do you want to learn?</h3><label>Language to learn</label><select id="wl">${Object.keys(LANGS).map(x=>`<option ${x===S.lang?'selected':''}>${x}</option>`).join('')}</select><label>Your level</label><select id="wv">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${x===S.level?'selected':''}>${x}</option>`).join('')}</select></div>`);v.appendChild(c);c.querySelector('#wl').onchange=e=>{S.lang=e.target.value;tutorC=null;save()};c.querySelector('#wv').onchange=e=>{S.level=e.target.value;tutorC=null;save()}}
function rSetup(v){
 const T=['About you','Connect Gemini','Meet your tutor'];

 if(stp===0){meEditor(v);learnCard(v)}
 if(stp===1){const c=el(`<div class="card"><h3 style="margin-top:0">Connect Gemini (free)</h3><p class="muted">Create a free key at aistudio.google.com/apikey and paste it below. It stays in this browser and is only sent to Google.</p><label>Gemini API key</label><input id="wk" type="password" placeholder="Paste your key"></div>`);v.appendChild(c);c.querySelector('#wk').value=S.key}
 if(stp===2)tutorEditor(v);
 const er=el('<p id="we" style="color:var(--bad);font-weight:700"></p>'),r=el(`<div class="row"><button class="g" id="bk" ${stp?'':'disabled'}>Back</button><button class="p" id="nx" style="margin-left:auto">${stp===2?'Start learning':'Next'}</button></div>`);

 return `<svg viewBox="0 0 100 100"><rect x="15" y="22" width="70" height="84" rx="24" fill="#475569"/><rect x="21" y="28" width="58" height="70" rx="19" fill="#64748b"/><circle cx="78" cy="22" r="7" fill="#ef4444" opacity=".25"/><circle cx="78" cy="22" r="3.6" fill="#ef4444"/>${(HB[hs]||(()=>''))(h)}<path d="M10 100Q12 69 50 67Q88 69 90 100Z" fill="${c}"/><path d="M41 68Q50 79 59 68Z" fill="${sk}"/>${o==='hood'?OUT.hood:o==='suit'?OUT.suit:''}<rect x="43" y="58" width="14" height="12" rx="5" fill="${sk}"/><ellipse cx="50" cy="64" rx="8" ry="3.5" fill="#0002"/><ellipse cx="32" cy="48" rx="3.4" ry="5" fill="${sk}"/><ellipse cx="68" cy="48" rx="3.4" ry="5" fill="${sk}"/><ellipse cx="50" cy="46" rx="18" ry="20" fill="${sk}"/>${HF[hs](h)}${eyes()}${mouth}${T.gender==='girl'?'<path d="M38.4 43.8l-2.2-1.4M61.6 43.8l2.2-1.4M39.5 42.8l-1-2.4M60.5 42.8l1-2.4" stroke="#2b1816" stroke-width="1.3" stroke-linecap="round"/>':''}${gl?TOP.glasses:''}${ph?`<path d="M31 46Q30 14 50 14Q70 14 69 46" fill="none" stroke="${ph}" stroke-width="4"/><rect x="25.5" y="39" width="9" height="16" rx="4.5" fill="${ph}"/><rect x="65.5" y="39" width="9" height="16" rx="4.5" fill="${ph}"/>`:''}${TOP.mic}<rect x="62" y="66" width="16" height="24" rx="8" fill="#cbd5e1"/><path d="M62 74h16M62 79h16M62 84h16" stroke="#94a3b8" stroke-width="1.2"/><path d="M59 70v14Q59 95 70 95Q81 95 81 84V70" fill="none" stroke="#334155" stroke-width="2"/><path d="M70 95v6" stroke="#334155" stroke-width="3"/></svg>`}
function tutorEditor(v){
 const T=S.tutor,card=el('<div class="card"><h3 style="margin-top:0">Your tutor</h3><div class="hd"><div id="tp"></div><div style="flex:1"><label>Name</label><input id="tn" maxlength="14"></div></div><div id="tr"></div></div>');
 v.appendChild(card);card.querySelector('#tn').value=T.name;
 card.querySelector('#tn').oninput=e=>{T.name=e.target.value.trim()||'Podi';tutorC=null;save()};
 const R=[['I am a','gender',['boy','girl']],['Skin','sk',['#f7c6a8','#e2a77f','#c68a62','#8d5a3b','#5c3a24']],['Hair style','hs',['short','quiff','long','bun','curly']],['Hair color','h',['#2a1a17','#4a2b27','#8a5a2b','#d9a441','#8b929c','#c2410c']],['Outfit','o',['hood','tee','suit']],['Outfit color','c',['#0f9d6a','#2f7de8','#c2410c','#7c3aed','#ec4899','#f59e0b','#111827']],['Headphones','ph',['','#2563eb','#ef4444','#111827','#ec4899']],['Glasses','gl',[false,true]],['Background','bg',['#fde68a','#a5c8ff','#b8ead9','#fbcfe8','#d8d0f5','#fcd9b0']]];
 const draw=()=>{card.querySelector('#tp').innerHTML=av('tutor','xl');const r=card.querySelector('#tr');r.innerHTML='';
  R.forEach(([lb,k,os])=>{r.appendChild(el(`<label>${lb}</label>`));const w=el('<div class="rw"></div>');
   os.forEach(o=>{const b=el('<button class="sw"></button>');const col=typeof o==='string'&&o[0]==='#';
    if(col)b.style.background=o;else b.textContent=o===''?'None':o===true?'Yes':o===false?'No':o;if(col)b.style.minWidth='34px';
    if(T[k]===o)b.classList.add('on');b.onclick=()=>{T[k]=o;if(k==='gender')T.hs=o==='girl'?'long':'quiff';tutorC=null;save();draw()};w.appendChild(b)});r.appendChild(w)})};
 draw();const hv=el('<button class="g" style="margin-top:14px">🔊 Hear my voice</button>');hv.onclick=()=>speak("Hi, I'm "+T.name+'!',null,'tutor',1);card.appendChild(hv)}
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.sc');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(500px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(6px)`});
document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.sc');if(c)c.style.transform=''});
const tutorSys=()=>`You are ${S.tutor.name} (a ${S.tutor.gender==='girl'?'woman':'man'}), a friendly ${S.lang} tutor for a ${S.level} learner. Reply mostly in ${S.lang} at their level, in 1-3 short sentences. If they make a mistake, add a brief correction in the learner's native language on a new line starting with "Tip:". End with a short question to keep talking. ${meCtx()}`;
function rSet(v){queueMicrotask(()=>{meEditor(v);tutorEditor(v)});v.innerHTML=`<div class="card"><label>Gemini API key (free at aistudio.google.com/apikey)</label><input id="k" type="password" value="${S.key}" placeholder="AIza...">
<p class="muted">Stored only in this browser. Requests go straight from your browser to Google.</p>
<label>Language to learn</label><select id="l">${Object.keys(LANGS).map(x=>`<option ${x===S.lang?'selected':''}>${x}</option>`)}</select>
<label>Level</label><select id="lv">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${x===S.level?'selected':''}>${x}</option>`)}</select>
<label>AI model <span class="muted">(change only if Google retires it)</span></label><input id="md" value="${S.model}">
<label><input type="checkbox" id="vo" style="width:auto" ${S.voice?'checked':''}> Tutor speaks replies aloud</label><br><button class="p" id="sv">Save</button></div>`;
 $('#sv').onclick=()=>{S.key=$('#k').value.trim();S.lang=$('#l').value;S.level=$('#lv').value;S.model=$('#md').value.trim()||'gemini-3.8-flash';S.voice=$('#vo').checked;tutorC=null;chat=null;save();tab='learn';render()}}
function rLearn(v){
 if(quiz&&quiz.done){v.innerHTML=`<div class="card" style="text-align:center"><div class="big">${quiz.score}/${quiz.q.length}</div><p>+${quiz.score*10} XP earned</p><button class="p" id="a">Next lesson</button></div>`;$('#a').onclick=()=>{quiz=null;render()};return}
 if(quiz){const q=quiz.q[quiz.i];v.innerHTML=`<div class="card"><div class="bar"><i style="width:${quiz.i/quiz.q.length*100}%"></i></div><h3>${q.q}</h3><div id="o"></div><div id="ex"></div></div>`;
  q.options.forEach((t,j)=>{const b=el('<button class="opt"></button>');b.textContent=t;b.onclick=()=>{if(quiz.ans)return;quiz.ans=1;const ok=j===q.answer;if(ok){quiz.score++;b.classList.add('right')}else{b.classList.add('wrong');$('#o').children[q.answer].classList.add('right')}
   const ex=$('#ex');ex.innerHTML=`<p>${ok?'✅ Correct!':'❌ Not quite.'} <span class="muted"></span></p><button class="p">Continue</button>`;ex.querySelector('span').textContent=q.explain||'';
   ex.querySelector('button').onclick=()=>{quiz.ans=0;quiz.i++;if(quiz.i>=quiz.q.length){quiz.done=1;bump(quiz.score*10)}render()}};$('#o').appendChild(b)});return}
 v.innerHTML=`<div class="card hd">${av('tutor','xl')}<div><h2 style="margin:0">${S.me.name?'Hi '+esc(S.me.name)+'! ':'Hi! '}I'm ${esc(S.tutor.name)}.</h2><p style="margin:4px 0 12px">Ready for today's ${S.lang} lesson? 5 quick questions, then let's talk.${S.me.name?'':' First, tell me about yourself in Settings.'}</p><button class="p" id="go">Start lesson</button> <button class="g" id="cz">Customise tutor</button><p id="e" class="muted"></p></div><div class="chips"><i style="background:#c4b5fd">⚡</i><i style="background:#bfdbfe">A+</i><i style="background:#fecaca">▶</i><i style="background:#fde68a">📄</i></div></div>`;
 $('#cz').onclick=()=>{tab='settings';render()};$('#go').onclick=async e=>{e.target.disabled=1;e.target.textContent='Creating lesson...';
  try{const q=await gem([{role:'user',parts:[{text:`Make 5 multiple-choice questions teaching ${S.lang} to a speaker of ${S.me.native} at ${S.level} level${S.me.goal?', focused on their goal: '+S.me.goal:''}. Mix vocabulary, grammar, translation. JSON array of {"q":string,"options":[4 strings],"answer":index 0-3,"explain":short string in ${S.me.native}}.`}]}],'',true);
   quiz={q:q.slice(0,5),i:0,score:0};render()}catch(x){$('#e').textContent=x.message;e.target.disabled=0;e.target.textContent='Start lesson'}}}
function rPractice(v){
 if(chat){rChat(v,chat);return}
 v.innerHTML=`<p class="muted">Pick a situation. An AI character plays the other person, then grades you.</p><div class="grid"></div>`;
 SCEN.forEach(([i,n,p,a,bn])=>{const b=el(`<button class="sc hd">${av(a)}<span><b>${n}</b><span class="muted">${bn}</span></span></button>`);
  b.onclick=()=>{chat={sys:`${p} Speak ${S.lang} at ${S.level} level. Keep replies to 1-3 sentences. Start by greeting and asking the first question. ${meCtx()}`,title:n,grade:1,scen:n,start:1,av:a,bn};render()};v.querySelector('.grid').appendChild(b)})}
function speak(t,cb,k,force){if(!(S.voice||force)||!window.speechSynthesis){cb&&cb();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/Tip:[\s\S]*/,'')),P=k&&k!=='tutor'?VC[k]:null,vc=pickVoice(k||'tutor');u.lang=LANGS[S.lang];if(vc)u.voice=vc;u.pitch=P?P[1]:(S.tutor.gender==='girl'?1.15:.9);u.rate=P?P[2]:1;u.onend=u.onerror=()=>cb&&cb();speechSynthesis.speak(u)}
function rChat(v,c){
 c.h=c.h||[];const a=c.av||'tutor';
 v.innerHTML=`<div class="card"><div class="hd">${av(a,'lg')}<div><b style="font-size:18px">${esc(c.bn||'Podi')}</b><div class="muted">${c.title}</div></div>${c.grade?'<button class="g" id="x" style="margin-left:auto">Finish</button>':''}</div><div id="log"></div>
 <div class="row"><button class="g mic" id="mic" title="Speak">🎙️</button><input id="t" placeholder="Type or tap the mic..."><button class="p" id="s">Send</button></div><p id="e" class="muted"></p></div>`;
 const log=$('#log'),A=$('.hd .av');
 const add=(r,t)=>{const u=r==='user',m=el('<div class="m"></div>');m.className='m '+(u?'u':'a');m.textContent=t;const row=el(`<div class="mr ${u?'u':''}">${u?'':av(a,'sm')}</div>`);row.appendChild(m);log.appendChild(row);log.scrollTop=1e9;return row};
 c.h.forEach(m=>{if(!(m.role==='user'&&m.parts[0].text==='Begin.'))add(m.role,m.parts[0].text)});
 async function turn(){A.classList.add('talk');const d=add('model','• • •');
  try{const t=await gem(c.h.slice(-10),c.sys);d.remove();c.h.push({role:'model',parts:[{text:t}]});add('model',t);speak(t,()=>A.classList.remove('talk'),a)}catch(x){d.remove();A.classList.remove('talk');$('#e').textContent=x.message}}
 if(!c.h.length){if(c.open){c.h.push({role:'model',parts:[{text:c.open}]});add('model',c.open)}else if(c.start){c.h.push({role:'user',parts:[{text:'Begin.'}]});turn()}}
 const send=async()=>{const i=$('#t'),t=i.value.trim();if(!t)return;i.value='';c.h.push({role:'user',parts:[{text:t}]});add('user',t);bump(2);await turn()};
 $('#s').onclick=send;$('#t').onkeydown=e=>{if(e.key==='Enter')send()};
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 $('#mic').onclick=()=>{if(!SR){$('#e').textContent='Voice input needs Chrome or Edge.';return}
  if(rec){rec.stop();return}rec=new SR();rec.lang=LANGS[S.lang];rec.onresult=e=>{$('#t').value=e.results[0][0].transcript;send()};
  rec.onerror=e=>{$('#e').textContent='Mic error: '+e.error+(e.error==='not-allowed'?' - allow the microphone for this site (needs https).':'')};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('on')};$('#mic').classList.add('on');rec.start()};
 if($('#x'))$('#x').onclick=async e=>{const us=c.h.filter(m=>m.role==='user'&&m.parts[0].text!=='Begin.').length;if(us<2){$('#e').textContent='Say a few more things first.';return}
  e.target.disabled=1;e.target.textContent='Grading...';
  try{const tr=c.h.map(m=>(m.role==='user'?'LEARNER: ':'AI: ')+m.parts[0].text).join('\n');
   const g=await gem([{role:'user',parts:[{text:`Grade the LEARNER's ${S.lang} in this "${c.scen}" practice (${S.level} level). ${S.me.goal?'Learner goal: '+S.me.goal+'. ':''}Be honest and specific; also judge conversation flow and respectfulness. JSON: {"overall":0-100,"fluency":0-100,"grammar":0-100,"vocabulary":0-100,"confidence":0-100,"strengths":[2 short strings],"improve":[3 short actionable strings],"better":[up to 3 {"said":string,"say":string}]}\n\n${tr}`}]}],'',true);
   bump(Math.round(g.overall/5));showGrade(v,g)}catch(x){$('#e').textContent=x.message;e.target.disabled=0;e.target.textContent='Finish'}}}
function showGrade(v,g){
 const bars=['fluency','grammar','vocabulary','confidence'].map(k=>`<p>${k[0].toUpperCase()+k.slice(1)} <b>${g[k]}</b></p><div class="bar"><i style="width:${g[k]}%"></i></div>`).join('');
 v.innerHTML=`<div class="card"><div style="text-align:center"><div class="big">${g.overall}</div><span class="muted">overall score</span></div>${bars}<h3>Strengths</h3><ul id="a"></ul><h3>How to improve</h3><ul id="b"></ul><h3>Say it better</h3><ul id="c"></ul><button class="p" id="r">Practice again</button></div>`;
 g.strengths.forEach(t=>{const l=el('<li></li>');l.textContent=t;$('#a').appendChild(l)});g.improve.forEach(t=>{const l=el('<li></li>');l.textContent=t;$('#b').appendChild(l)});
 (g.better||[]).forEach(o=>{const l=el('<li></li>');l.textContent=`"${o.said}" → "${o.say}"`;$('#c').appendChild(l)});
 $('#r').onclick=()=>{chat=null;render()}}
save();render();
</script></body></html>
